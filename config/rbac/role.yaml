---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - cardinality.telemetry-compass.com
  resources:
  - cardinalitybudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cardinality.telemetry-compass.com
  resources:
  - cardinalitybudgets/finalizers
  verbs:
  - update
- apiGroups:
  - cardinality.telemetry-compass.com
  resources:
  - cardinalitybudgets/status
  verbs:
  - get
  - patch
  - update
