# This rule is not used by the project cardinality-budget-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to cardinality.telemetry-compass.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cardinality-budget-operator
    app.kubernetes.io/managed-by: kustomize
  name: cardinalitybudget-viewer-role
rules:
- apiGroups:
  - cardinality.telemetry-compass.com
  resources:
  - cardinalitybudgets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cardinality.telemetry-compass.com
  resources:
  - cardinalitybudgets/status
  verbs:
  - get
