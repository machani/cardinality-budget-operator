# F-0303: only pods in namespaces labelled 'metrics: enabled' (for example the monitoring namespace
# running Prometheus) may reach the operator's authenticated metrics port. The health-probe port stays
# open so the kubelet's probes work with every network plugin. Everything else is denied.
#   kubectl label namespace monitoring metrics=enabled
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: cardinality-budget-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cardinality-budget-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              metrics: enabled
      ports:
        - port: 8443
          protocol: TCP
    - ports:
        - port: 8081
          protocol: TCP
