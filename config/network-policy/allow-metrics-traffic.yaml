# F-0303: only pods in namespaces labelled 'metrics: enabled' (the namespace of the Prometheus that scrapes the
# operator, for example monitoring) may reach the operator's authenticated metrics port. Everything else is
# denied, except the health-probe port in allow-health-probes.yaml.
#   kubectl label namespace monitoring metrics=enabled
# Keep this policy to the one metrics rule: the Helm plugin rewrites every ingress port of a policy with this
# name to .Values.metrics.port (v1.0.1 fix: a second rule here became "8443 from anywhere" in the chart).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: cardinality-budget-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cardinality-budget-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              metrics: enabled
      ports:
        - port: 8443
          protocol: TCP
