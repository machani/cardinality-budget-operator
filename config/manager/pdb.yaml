# F-0302: keep one operator replica during voluntary disruptions (node drains, upgrades). Only the
# leader acts; the other replica waits on the leader-election lease and takes over in seconds.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cardinality-budget-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  minAvailable: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cardinality-budget-operator
