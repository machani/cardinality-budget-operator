name: E2E Tests

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  # A newer push to the same branch or PR cancels the older, now pointless, run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    # F-0306 compatibility matrix (ADR 0011): the three Kubernetes minors under upstream support with the
    # newest Prometheus Operator, plus the oldest supported Prometheus Operator on the newest Kubernetes.
    # Node images are the ones published for kind v0.33.0, pinned by digest. Versions recorded as Phase 1
    # fact 8 (2026-10-13).
    name: K8s ${{ matrix.kubernetes }}, Prometheus Operator ${{ matrix.prometheus-operator }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.37"
            node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            prometheus-operator: v0.94.1
          - kubernetes: "1.36"
            node-image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
            prometheus-operator: v0.94.1
          - kubernetes: "1.35"
            node-image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
            prometheus-operator: v0.94.1
          - kubernetes: "1.37"
            node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            prometheus-operator: v0.86.2
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # A pull request that changes only documentation skips the steps below; the job still reports
      # success, so the required checks pass without a full run (hack/ci/docs-only.sh).
      - name: Detect a docs-only change
        id: changes
        run: bash hack/ci/docs-only.sh

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # bin/ holds the tools the Makefile builds or downloads (controller-gen, kustomize, setup-envtest and
      # the envtest binaries, the custom golangci-lint). Building them takes minutes; cache them.
      - name: Cache tools in bin/
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: bin-${{ runner.os }}-${{ hashFiles('Makefile', '.custom-gcl.yml', 'go.mod') }}

      # Pinned to the version used by the lab (ADR 0011: pin tools).
      - name: Install kind v0.33.0
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        if: steps.changes.outputs.docs_only != 'true'
        run: kind version

      # test/crds holds the newest supported release; other matrix rows replace it with their version.
      - name: Use the Prometheus Operator ${{ matrix.prometheus-operator }} CRDs
        if: steps.changes.outputs.docs_only != 'true' && matrix.prometheus-operator != 'v0.94.1'
        env:
          VERSION: ${{ matrix.prometheus-operator }}
        run: |
          for r in servicemonitors podmonitors prometheusrules; do
            curl -fsSLo "test/crds/monitoring.coreos.com_${r}.yaml" \
              "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${VERSION}/example/prometheus-operator-crd/monitoring.coreos.com_${r}.yaml"
          done

      - name: Running Test e2e
        if: steps.changes.outputs.docs_only != 'true'
        # The operator has no webhooks, so it needs no cert-manager; skipping it also removes a download
        # from GitHub that can time out.
        env:
          CERT_MANAGER_INSTALL_SKIP: "true"
          KIND_NODE_IMAGE: ${{ matrix.node-image }}
        run: make test-e2e
