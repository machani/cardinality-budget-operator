name: Image

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    permissions:
      contents: read
    # F-0306: build for both supported platforms (ADR 0011: linux/amd64, linux/arm64) and scan the image.
    # Nothing is pushed; releases publish through release.yml (F-1002, ADR 0018).
    name: Multi-arch build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # A pull request that changes only documentation skips the steps below; the job still reports
      # success, so the required checks pass without a full run (hack/ci/docs-only.sh).
      - name: Detect a docs-only change
        id: changes
        run: bash hack/ci/docs-only.sh

      - name: Set up QEMU
        if: steps.changes.outputs.docs_only != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.changes.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 and linux/arm64
        if: steps.changes.outputs.docs_only != 'true'
        run: docker buildx build --platform linux/amd64,linux/arm64 -t cardinality-budget-operator:ci .

      - name: Build the amd64 image for scanning
        if: steps.changes.outputs.docs_only != 'true'
        run: docker buildx build --platform linux/amd64 --load -t cardinality-budget-operator:scan .

      - name: Scan for vulnerabilities
        if: steps.changes.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cardinality-budget-operator:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
