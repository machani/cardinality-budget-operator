name: Verify

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  # A newer push to the same branch or PR cancels the older, now pointless, run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    name: Tidy, generated files, license headers
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      # A pull request that changes only documentation skips the steps below; the job still reports
      # success, so the required checks pass without a full run (hack/ci/docs-only.sh).
      - name: Detect a docs-only change
        id: changes
        run: bash hack/ci/docs-only.sh

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # bin/ holds the tools the Makefile builds or downloads (controller-gen, kustomize, setup-envtest and
      # the envtest binaries, the custom golangci-lint). Building them takes minutes; cache them.
      - name: Cache tools in bin/
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: bin-${{ runner.os }}-${{ hashFiles('Makefile', '.custom-gcl.yml', 'go.mod') }}

      - name: Verify
        if: steps.changes.outputs.docs_only != 'true'
        run: make verify

  vulncheck:
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      # A pull request that changes only documentation skips the steps below; the job still reports
      # success, so the required checks pass without a full run (hack/ci/docs-only.sh).
      - name: Detect a docs-only change
        id: changes
        run: bash hack/ci/docs-only.sh

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Scan for known vulnerabilities
        if: steps.changes.outputs.docs_only != 'true'
        run: make vulncheck
