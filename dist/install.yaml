apiVersion: v1
data:
  cardinalitybudget.json: |
    {
      "title": "CardinalityBudget",
      "uid": "cardinalitybudget",
      "tags": ["cardinality", "prometheus"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {"from": "now-24h", "to": "now"},
      "templating": {
        "list": [
          {"name": "datasource", "type": "datasource", "query": "prometheus", "label": "Data source"},
          {
            "name": "budget_namespace", "type": "query", "label": "Namespace", "multi": true, "includeAll": true,
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "query": "label_values(cardinalitybudget_limit, budget_namespace)", "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "type": "stat", "title": "Kill switch", "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"expr": "max(cardinalitybudget_enforcement_paused)", "refId": "A"}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "Off"}, "1": {"text": "ON", "color": "red"}}}]}}
        },
        {
          "type": "stat", "title": "Budgets paused", "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"expr": "count(cardinalitybudget_paused == 1) or vector(0)", "refId": "A"}]
        },
        {
          "type": "stat", "title": "Budgets without a valid measurement", "gridPos": {"x": 8, "y": 0, "w": 5, "h": 4},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"expr": "count(cardinalitybudget_measurement_valid == 0) or vector(0)", "refId": "A"}]
        },
        {
          "type": "stat", "title": "Drops in the last hour (all budgets)", "gridPos": {"x": 13, "y": 0, "w": 5, "h": 4},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"expr": "max(cardinalitybudget_drops_last_hour)", "refId": "A"}]
        },
        {
          "type": "stat", "title": "Reconcile errors (10m)", "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"expr": "sum(increase(controller_runtime_reconcile_errors_total{controller=\"cardinalitybudget\"}[10m]))", "refId": "A"}]
        },
        {
          "type": "timeseries", "title": "Usage (share of budget)", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 9},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"expr": "cardinalitybudget_usage_ratio{budget_namespace=~\"$budget_namespace\"}", "legendFormat": "{{budget_namespace}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.9}, {"color": "red", "value": 1}]}}}
        },
        {
          "type": "timeseries", "title": "Active series and limit", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 9},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "cardinalitybudget_active_series{budget_namespace=~\"$budget_namespace\"}", "legendFormat": "{{budget_namespace}} series", "refId": "A"},
            {"expr": "cardinalitybudget_limit{budget_namespace=~\"$budget_namespace\"}", "legendFormat": "{{budget_namespace}} limit", "refId": "B"}
          ]
        },
        {
          "type": "timeseries", "title": "Metrics dropped per budget", "gridPos": {"x": 0, "y": 13, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"expr": "cardinalitybudget_drops_active{budget_namespace=~\"$budget_namespace\"}", "legendFormat": "{{budget_namespace}}", "refId": "A"}]
        },
        {
          "type": "table", "title": "Paused budgets", "gridPos": {"x": 12, "y": 13, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [{"expr": "cardinalitybudget_paused == 1", "format": "table", "instant": true, "refId": "A"}]
        }
      ]
    }
