    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cardinality-budget-operator
    control-plane: controller-manager
  name: cardinality-budget-operator-controller-manager-metrics-service
  namespace: cardinality-budget-operator-system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: cardinality-budget-operator
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cardinality-budget-operator
    control-plane: controller-manager
  name: cardinality-budget-operator-controller-manager
  namespace: cardinality-budget-operator-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cardinality-budget-operator
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: cardinality-budget-operator
        control-plane: controller-manager
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cardinality-budget-operator
                  control-plane: controller-manager
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --prometheus-url=http://kps-prometheus.monitoring.svc:9090
        command:
        - /manager
        image: controller:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cardinality-budget-operator-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cardinality-budget-operator
    control-plane: controller-manager
  name: cardinality-budget-operator-controller-manager
  namespace: cardinality-budget-operator-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cardinality-budget-operator
      control-plane: controller-manager
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cardinality-budget-operator
  name: cardinality-budget-operator-alerts
  namespace: cardinality-budget-operator-system
spec:
  groups:
  - name: cardinality-budget-operator
    rules:
    - alert: CardinalityBudgetOperatorDown
      annotations:
        description: Budgets are not measured and drops are neither added nor restored.
        runbook_url: https://github.com/machani/cardinality-budget-operator/blob/dev/docs/runbooks/README.md#cardinalitybudgetoperatordown
        summary: No CardinalityBudget operator replica is being scraped.
      expr: absent(up{job="cardinality-budget-operator-controller-manager-metrics-service"}
        == 1)
      for: 10m
      labels:
        severity: critical
    - alert: CardinalityBudgetReconcileErrors
      annotations:
        description: Unexpected API errors for 15 minutes. Expected states (backend
          down, conflicts) are not errors.
        runbook_url: https://github.com/machani/cardinality-budget-operator/blob/dev/docs/runbooks/README.md#cardinalitybudgetreconcileerrors
        summary: The CardinalityBudget controller keeps failing to reconcile.
      expr: sum(rate(controller_runtime_reconcile_errors_total{controller="cardinalitybudget"}[10m]))
        > 0
      for: 15m
      labels:
        severity: warning
    - alert: CardinalityBudgetMeasurementInvalid
      annotations:
        description: Phase is Unknown; nothing is planned, dropped or restored. See
          the budget's Ready condition for the reason.
        runbook_url: https://github.com/machani/cardinality-budget-operator/blob/dev/docs/runbooks/README.md#cardinalitybudgetmeasurementinvalid
        summary: Budget in {{ $labels.budget_namespace }} has no valid measurement.
      expr: cardinalitybudget_measurement_valid == 0
      for: 15m
      labels:
        severity: warning
    - alert: CardinalityBudgetPaused
      annotations:
        description: No new drops until the platform team resumes it with the resume-enforcement
          annotation.
        runbook_url: https://github.com/machani/cardinality-budget-operator/blob/dev/docs/runbooks/README.md#cardinalitybudgetpaused
        summary: Budget in {{ $labels.budget_namespace }} is paused ({{ $labels.reason
          }}).
      expr: cardinalitybudget_paused == 1
      for: 5m
      labels:
        severity: warning
    - alert: CardinalityBudgetConfigReloadFailed
      annotations:
        description: Prometheus may be running an old configuration for every team.
          Check its config reload status now.
        runbook_url: https://github.com/machani/cardinality-budget-operator/blob/dev/docs/runbooks/README.md#cardinalitybudgetconfigreloadfailed
        summary: Prometheus did not load its config after a change for {{ $labels.budget_namespace
          }}.
      expr: cardinalitybudget_paused{reason="ConfigReloadFailed"} == 1
      for: 1m
      labels:
        severity: critical
    - alert: CardinalityBudgetKillSwitchActive
      annotations:
        description: No monitor is changed, including restores and deletion cleanup.
          Budgets being deleted wait.
        runbook_url: https://github.com/machani/cardinality-budget-operator/blob/dev/docs/runbooks/README.md#cardinalitybudgetkillswitchactive
        summary: The global kill switch --enforcement-paused is on.
      expr: max(cardinalitybudget_enforcement_paused) == 1
      for: 5m
      labels:
        severity: warning
    - alert: CardinalityBudgetRateLimited
      annotations:
        description: At the default --max-drops-per-hour (10) new drops wait. Several
          namespaces may be exploding at once.
        runbook_url: https://github.com/machani/cardinality-budget-operator/blob/dev/docs/runbooks/README.md#cardinalitybudgetratelimited
        summary: Many drops in the last hour across all budgets.
      expr: max(cardinalitybudget_drops_last_hour) >= 10
      for: 5m
      labels:
        severity: info
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cardinality-budget-operator
    control-plane: controller-manager
  name: cardinality-budget-operator-controller-manager-metrics-monitor
  namespace: cardinality-budget-operator-system
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    path: /metrics
    port: https
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
  selector:
    matchLabels:
      app.kubernetes.io/name: cardinality-budget-operator
      control-plane: controller-manager
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cardinality-budget-operator
  name: cardinality-budget-operator-allow-metrics-traffic
  namespace: cardinality-budget-operator-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          metrics: enabled
    ports:
    - port: 8443
      protocol: TCP
  - ports:
    - port: 8081
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cardinality-budget-operator
      control-plane: controller-manager
  policyTypes:
  - Ingress
