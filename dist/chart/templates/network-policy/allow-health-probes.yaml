{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "cardinality-budget-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "cardinality-budget-operator.resourceName" (dict "suffix" "allow-health-probes" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  ingress:
  - ports:
    - port: 8081
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cardinality-budget-operator.name" . }}
      control-plane: controller-manager
  policyTypes:
  - Ingress
{{- end }}
